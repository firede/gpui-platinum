[package]
name = "gpui-platinum"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Pixel-drawn Platinum controls for GPUI"
readme = "README.md"
keywords = ["gpui", "gui", "widgets", "platinum", "desktop"]
categories = ["gui"]

[features]
default = ["diagram"]
# Mermaid diagrams laid out by limu and drawn in the look, in the diagram
# module.
diagram = ["dep:limu", "dep:limu-gpui"]

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.12" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.12", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
limu = { version = "0.1.0", optional = true }
limu-gpui = { version = "0.1.0", optional = true }
unicode-segmentation = "1.12"
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-fast", version = "0.1.12", features = ["test-support", "leak-detection"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.12", features = ["test-support", "font-kit", "runtime_shaders", "wayland", "x11"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 1

# The Controls show a diagram, and the diagrams example shows every type.
[[example]]
name = "controls"
path = "examples/controls.rs"
required-features = ["diagram"]

[[example]]
name = "desktop"
path = "examples/desktop.rs"
required-features = ["diagram"]

[[example]]
name = "diagrams"
path = "examples/diagrams.rs"
required-features = ["diagram"]

# Scenes drawn by GPUI's offscreen renderer, which must run on the main
# thread, against the original's pictures.
[[test]]
name = "snapshots"
path = "tests/snapshots/main.rs"
harness = false
required-features = ["diagram"]
