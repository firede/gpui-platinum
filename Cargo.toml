[package]
name = "gpui-platinum"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Pixel-drawn Platinum controls for GPUI"
readme = "README.md"
keywords = ["gpui", "gui", "widgets", "platinum", "desktop"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/longbridge/gpui-fast", rev = "07b42eb" }
gpui_platform = { git = "https://github.com/longbridge/gpui-fast", rev = "07b42eb", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
unicode-segmentation = "1.12"
serde_json = "1"

[dev-dependencies]
gpui = { git = "https://github.com/longbridge/gpui-fast", rev = "07b42eb", features = ["test-support", "leak-detection"] }
gpui_platform = { git = "https://github.com/longbridge/gpui-fast", rev = "07b42eb", features = ["test-support", "font-kit", "runtime_shaders", "wayland", "x11"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 1

[[example]]
name = "controls"
path = "examples/controls.rs"

# Scenes drawn by GPUI's offscreen renderer, which must run on the main
# thread, against the original's pictures.
[[test]]
name = "snapshots"
path = "tests/snapshots/main.rs"
harness = false
