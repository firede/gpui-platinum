name: site

# Builds the web page and deploys it to Cloudflare as a release is
# published, from the release's tag, or by hand, from the branch chosen.
# Needs the repository's secret CLOUDFLARE_API_TOKEN: a token that may edit
# Workers (Cloudflare's "Edit Cloudflare Workers" template).
#
# On macOS: the desktop example draws the page's pictures with GPUI's
# offscreen renderer, which there is Metal, the renderer the pictures are
# checked against (tests/snapshots); on Linux it would be wgpu on a
# software adapter, whose pictures nothing checks.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 30
    environment:
      name: site
      url: https://gpui-platinum.firede.com
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
